<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="x-subject" content="Verificá tu email — Subite" />
  <title>Código de verificación</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f7f8fa; padding:24px; color:#121223;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;">
    <tr>
      <td>
        <h1 style="font-size:20px;margin:0 0 12px;">Verificá tu email</h1>
        <p style="margin:0 0 16px;line-height:1.5;color:#41414f;">
          Hola {{name}}, usá este código en la app Subite para confirmar tu cuenta:
        </p>
        <p style="font-size:32px;letter-spacing:8px;font-weight:700;text-align:center;margin:24px 0;color:#059669;">
          {{code}}
        </p>
        <p style="margin:0 0 8px;line-height:1.5;color:#41414f;font-size:14px;">
          Vence en {{minutes}} minutos. Si no creaste una cuenta, ignorá este correo.
        </p>
        <p style="margin:24px 0 0;font-size:12px;color:#babdcc;">Subite</p>
      </td>
    </tr>
  </table>
</body>
</html>
